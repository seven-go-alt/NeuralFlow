[project]
name = "neuralflow"
version = "0.1.0"
description = "NeuralFlow agent framework with layered memory, intent routing, and async summarization."
readme = "README.md"
authors = [
    { name = "caisiying", email = "csypeal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.22.1",
    "celery>=5.6.3",
    "fastapi>=0.135.3",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "litellm>=1.86.1",
    "markdown-it-py>=4.2.0",
    "prometheus-client>=0.22.1,<1.0.0",
    "pyjwt>=2.8.0",
    "psycopg[binary]>=3.2.12",
    "pydantic-settings>=2.13.1",
    "pdfplumber>=0.11.0",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "redis>=7.4.0",
    "sentry-sdk>=2.20.0",
    "sqlalchemy>=2.0.44",
    "tenacity>=9.1.4",
    "tiktoken>=0.9.0",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
neuralflow = "neuralflow:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.optional-dependencies]
ml = [
    "chromadb>=1.5.7",
    "sentence-transformers>=3.4.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "fpdf2>=2.8.0",
    "locust>=2.37.14",
    "mypy>=1.18.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "types-aiofiles>=24.1.0",
    "hypothesis>=6.119.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
sort = "cover"
