services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: sh -c "uv run celery -A worker.celery_app worker --loglevel=info --pool=${CELERY_WORKER_POOL:-solo}"
    env_file:
      - .env
    depends_on:
      - redis
      - chroma

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  chroma:
    image: chromadb/chroma:1.0.20
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
