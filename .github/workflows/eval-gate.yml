name: eval-gate

on:
  pull_request:
    paths:
      - 'app/rag/**'
      - 'app/evals/**'
      - 'app/retrieval/**'
      - 'app/embeddings/**'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: uv run pytest tests/test_eval_regression.py -v
