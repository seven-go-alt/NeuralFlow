[mypy]
python_version = 3.11
files = app, tests, worker.py
mypy_path = .
pretty = True
show_error_codes = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
ignore_missing_imports = True
explicit_package_bases = True
exclude = (^\.venv/|^data/)

[mypy-tests.*]
disable_error_code = var-annotated, assignment, arg-type

# redis.lrange() 返回 union type，静态标注 list[str] 是安全的运行时假设
[mypy-app.memory.working]
disable_error_code = assignment

# try/except import: 导入失败时赋 None 是预期行为
[mypy-app.utils.observability]
disable_error_code = assignment

# ChromaDB 的类型桩对 numpy ndarray 的限制过严，运行时 embedding 参数兼容
[mypy-app.retrieval.chroma_store]
disable_error_code = arg-type
