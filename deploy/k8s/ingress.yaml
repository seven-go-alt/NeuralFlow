apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuralflow
  namespace: neuralflow
  labels:
    app.kubernetes.io/name: neuralflow
    app.kubernetes.io/part-of: neuralflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: neuralflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - neuralflow.example.com
      secretName: neuralflow-tls
