apiVersion: v1
kind: Secret
metadata:
  name: neuralflow-secret
  namespace: neuralflow
  labels:
    app.kubernetes.io/name: neuralflow
    app.kubernetes.io/part-of: neuralflow
type: Opaque
stringData:
  # IMPORTANT: Replace all values below with real secrets before deploying.
  # For production, use SealedSecrets, External Secrets Operator, or Vault.
  # Do NOT commit this file with real secrets to version control.

  # PostgreSQL
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql+psycopg://neuralflow:change-me@postgres:5432/neuralflow"

  # LLM Providers
  OPENAI_API_KEY: "change-me"
  LLM_API_KEY: "change-me"
  EMBEDDING_API_KEY: "change-me"

  # Authentication
  AUTH_JWT_SECRET: "change-to-a-strong-random-secret"

  # Monitoring
  SENTRY_DSN: ""
