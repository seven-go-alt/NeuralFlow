apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neuralflow.fullname" . }}-secret
  namespace: {{ .Values.global.namespace | default "neuralflow" }}
  labels:
    {{- include "neuralflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  EMBEDDING_API_KEY: {{ .Values.secrets.embeddingApiKey | quote }}
  AUTH_JWT_SECRET: {{ .Values.secrets.authJwtSecret | quote }}
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | quote }}
