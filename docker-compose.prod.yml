services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

  frontend:
    image: ${NEURALFLOW_FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-3001}:3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api: &api-base
    image: ${NEURALFLOW_API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      REDIS_HOST: redis
      CHROMA_HOST: chroma
      DOCUMENTS_STORAGE_DIR: /data/uploads
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,redis,chroma,postgres,api,worker,frontend}
    ports:
      - "${API_PUBLISHED_PORT:-8001}:8000"
    expose:
      - "8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      redis:
        condition: service_started
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *api-base
    command: sh -lc '/app/.venv/bin/celery -A worker.celery_app worker --loglevel=info --pool=${CELERY_WORKER_POOL:-solo}'
    expose: []
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A worker.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  chroma:
    image: chromadb/chroma:1.0.20
    restart: unless-stopped
    volumes:
      - chroma_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuralflow
      POSTGRES_USER: neuralflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralflow -d neuralflow"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  uploads_data:
  redis_data:
  chroma_data:
  postgres_data:
  caddy_data:
  caddy_config:
